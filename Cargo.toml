[package]
name = "gtos_core"
version = "0.1.1"
edition = "2021"
authors = ["TysonKenobi"]
description = "GTOS Core Operating System Architecture & Monolithic Conductor"
autobins = false
autotests = false

[profile.release]
opt-level = 3           # Maximize high-speed execution optimization
lto = true              # Enable Link-Time Optimization across layers
codegen-units = 1       # Reduce code generation units to optimize binary density

[profile.dev]
panic = "abort" # Enforces clean, high-speed execution aborts for dev targets

[profile.harness]
inherits = "dev"    # Inherits development debugging symbols
panic = "abort"     # Strictly forces abort behavior to stop the unwinding crash loop!

[lib]
name = "gtos_core"
path = "core/lib.rs"
crate-type = ["rlib", "staticlib"]  

# =========================================================================
# SYSTEM INTEGRATION UTILITIES & MAINTENANCE APPARATUSES
# =========================================================================
# Packages isolated layer tests as parallel, standalone application binaries

[[bin]]
name = "gtos-sysmon-l1"
path = "tests/gtos_layer1_harness.rs"
test = false

[[bin]]
name = "gtos-sysmon-l2"
path = "tests/gtos_layer2_harness.rs"
test = false

[[bin]]
name = "gtos-sysmon-l3"
path = "tests/gtos_layer3_harness.rs"
test = false

[[bin]]
name = "gtos-sysmon-l4"
path = "tests/gtos_layer4_harness.rs"
test = false

[[bin]]
name = "gtos-sysmon-l5"
path = "tests/gtos_layer5_harness.rs"
test = false

# =========================================================================
# CONDUCTOR AND MODULATOR SPECIAL CASE HARNESS AND TESTING EXCEPTION
# =========================================================================

[[test]]
name = "gtos-conductor-utility"
path = "tests/gtos_conductor_harness.rs"
harness = false

[[bin]]
name = "gtos-modulator-utility"
path = "tests/gtos_modulator_harness.rs"
Test = false

# =========================================================================
# PHASE 10 TARGET V1 CORE SYSTEMS (THE SCORE)
# =========================================================================
# These define the baseline operational tools to boot the V1 platform.
# They modulate chaotic inputs into clean, unfragmented 517-byte chords.

[[bin]]
name = "gtos-modulator-core"
path = "apps/gtos_modulator_core.rs"
# V1 Core Ingestor: Modulates raw byte streams into unallocated 517-byte chords.

[[bin]]
name = "gtos-core-shell"
path = "apps/gtos_shell.rs"
# V1 Core Dashboard: Master zero-allocation diagnostic steering wheel.

# =========================================================================
# FUTURE SENSUAL & HARDWARE ACCELERATION PLUGINS (LOAD-YOUR-OWN EXTENSIONS)
# =========================================================================
# Future plug-and-play tracking slots for the Instrument Ingestion Framework.

[[bin]]
name = "gtos-instrument-acoustic"
path = "apps/gtos_instrument_acoustic.rs"
test = false
# Ingests Speaker/Mic/Voice frequencies directly into 1/φ² compression voids [Instrument 0x02].

[[bin]]
name = "gtos-instrument-intelligence"
path = "apps/gtos_ai_bridge_universal.rs"
# Strips LLM model weights of host bloat, mapping parameters directly to silicon cell arrays [Instrument 0x03].

[[bin]]
name = "gtos-instrument-motherboard"
path = "apps/gtos_motherboard_core.rs"
Test = false
# Interrogates physical chipset buses to map attached hardware architectures [Instrument 0x04].

[[bin]]
name = "gtos-instrument-vision"
path = "apps/gtos_instrument_vision.rs"
# Maps VR/Spatial camera coordinates instantly into 24-byte FFI payloads [Instrument 0x05].

# [[bin]]
# name = "gtos-instrument-biometrics"
# path = "apps/gtos_bio_metrics.rs"
# Maps secure fingerprint, iris, and pulse invariants directly to geometric chords [Instrument 0x06].

# [[bin]]
# name = "gtos-instrument-robotics"
